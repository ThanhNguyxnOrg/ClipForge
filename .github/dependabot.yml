version: 2
updates:
  # GitHub Actions — the only external dependency of this C++ repo.
  # Mirrors ThanhNguyxnOrg convention (monthly grouped updates).
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
