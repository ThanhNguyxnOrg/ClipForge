version: 2
updates:
  # GitHub Actions — the only external dependency of this C++ repo.
  # Mirrors ThanhNguyxnOrg convention (weekly, Monday 06:00 Asia/Ho_Chi_Minh).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      action-dependencies:
        patterns:
          - "*"
